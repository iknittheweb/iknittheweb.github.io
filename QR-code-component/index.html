<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ensures proper scaling and rendering on all devices -->

    <!-- Favicon for browser tab -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
    <!-- Main stylesheet for QR code component -->
    <link rel="stylesheet" href="styles.css" />
    <!-- Google Fonts: Outfit, used for consistent typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
    <title>Frontend Mentor | QR code component</title>
  </head>

  <body class="qrpage">
    <!-- Main content container: centers card and attribution -->
    <main class="qrpage__container">
      <!-- QR card: contains image, title, and description -->
      <section class="qr-card">
        <img src="images/image-qr-code.png" alt="QR code to Frontend Mentor" class="qr-card__image" />
        <h1 class="qr-card__title">Improve your front-end skills by building projects</h1>
        <p class="qr-card__desc">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </section>
      <!-- Attribution footer: challenge source and author -->
      <footer class="qrpage__attribution"> Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. Coded by <a href="https://github.com/iknittheweb" target="_blank">I Knit the Web</a>. </footer>
    </main>
  </body>
</html>
